services:
  - type: web
    name: shalah-hours-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: shalah-postgres-db
          property: connectionString

databases:
  - name: shalah-postgres-db
    plan: free
    databaseName: shalah
    user: shalah_admin
